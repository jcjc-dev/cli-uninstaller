name: PR Validation

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}

jobs:
  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash scripts
        run: bash -n uninstall.sh lib/common.sh scripts/*.sh

  uninstall-smoke:
    name: ${{ matrix.tool }} on ${{ matrix.os }}
    needs: bash-syntax
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        tool:
          - junie
          - copilot-cli
          - claude-code
          - opencode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ${{ matrix.tool }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"

          case "${{ matrix.tool }}" in
            junie)
              curl -fsSL https://junie.jetbrains.com/install.sh | bash
              command -v junie
              junie --version
              ;;
            copilot-cli)
              curl -fsSL https://gh.io/copilot-install | bash
              command -v copilot
              copilot --help >/dev/null
              ;;
            claude-code)
              curl -fsSL https://claude.ai/install.sh | bash
              command -v claude
              claude --version
              ;;
            opencode)
              version="$(gh release view --repo anomalyco/opencode --json tagName --jq '.tagName | ltrimstr("v")')"
              curl -fsSL https://opencode.ai/install | bash -s -- --version "$version" --no-modify-path
              command -v opencode
              opencode --version
              ;;
          esac

      - name: Uninstall ${{ matrix.tool }} using checked-out PR code
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          export CLI_UNINSTALLER_BASE_URL="file://$GITHUB_WORKSPACE"

          cat uninstall.sh | bash -s -- "${{ matrix.tool }}" --yes --purge

      - name: Verify ${{ matrix.tool }} was removed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"

          case "${{ matrix.tool }}" in
            junie)
              ! command -v junie
              test ! -e "$HOME/.local/bin/junie"
              test ! -e "$HOME/.local/share/junie"
              ;;
            copilot-cli)
              ! command -v copilot
              test ! -e "$HOME/.local/bin/copilot"
              ;;
            claude-code)
              ! command -v claude
              test ! -e "$HOME/.local/bin/claude"
              test ! -e "$HOME/.local/share/claude"
              test ! -e "$HOME/.cache/claude"
              ;;
            opencode)
              ! command -v opencode
              test ! -e "$HOME/.opencode/bin/opencode"
              ;;
          esac

  windows-unsupported:
    name: Windows custom script installers
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool:
          - junie
          - claude-code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ${{ matrix.tool }}
        shell: pwsh
        run: |
          switch ("${{ matrix.tool }}") {
            "junie" {
              irm https://junie.jetbrains.com/install.ps1 | iex
              if (-not (Test-Path "$HOME\.local\bin\junie.bat")) { throw "junie.bat was not installed" }
            }
            "claude-code" {
              irm https://claude.ai/install.ps1 | iex
              if (-not ((Test-Path "$HOME\.local\bin\claude") -or (Test-Path "$HOME\.local\bin\claude.exe") -or (Test-Path "$HOME\.local\bin\claude.cmd"))) {
                throw "claude launcher was not installed"
              }
            }
          }

      - name: Uninstall ${{ matrix.tool }} using checked-out PR code
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content .\uninstall.ps1 -Raw))) "${{ matrix.tool }}" -Yes -Purge

      - name: Verify ${{ matrix.tool }} was removed
        shell: pwsh
        run: |
          switch ("${{ matrix.tool }}") {
            "junie" {
              if (Test-Path "$HOME\.local\bin\junie.bat") { throw "junie.bat still exists" }
              if (Test-Path "$HOME\.local\share\junie") { throw "Junie data still exists" }
            }
            "claude-code" {
              if (Test-Path "$HOME\.local\bin\claude") { throw "claude still exists" }
              if (Test-Path "$HOME\.local\bin\claude.exe") { throw "claude.exe still exists" }
              if (Test-Path "$HOME\.local\bin\claude.cmd") { throw "claude.cmd still exists" }
              if (Test-Path "$HOME\.local\share\claude") { throw "Claude install data still exists" }
              if (Test-Path "$HOME\.cache\claude") { throw "Claude cache still exists" }
            }
          }

  windows-bash-opencode:
    name: opencode on windows-latest Git Bash
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install opencode
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          version="$(gh release view --repo anomalyco/opencode --json tagName --jq '.tagName | ltrimstr("v")')"
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$version" --no-modify-path
          command -v opencode
          opencode --version

      - name: Uninstall opencode using checked-out PR code
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          export CLI_UNINSTALLER_BASE_URL="file://$GITHUB_WORKSPACE"

          cat uninstall.sh | bash -s -- opencode --yes --purge

      - name: Verify opencode was removed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"

          ! command -v opencode
          test ! -e "$HOME/.opencode/bin/opencode"
